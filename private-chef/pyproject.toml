[project]
name = "private-chef"
version = "0.1.0"
description = "A local-first, shared cooking assistant with OpenAI and WhatsApp via OpenClaw"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
private-chef = "private_chef.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
