name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-chef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.15.12
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: node openclaw/test.mjs
